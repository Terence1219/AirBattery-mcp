[project]
name = "airbattery-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents query device battery levels via AirBattery"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=2.2,<3"]

[project.scripts]
airbattery-mcp = "mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/mcp_server.py"]
sources = ["src"]
